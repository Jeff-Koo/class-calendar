<div class="modal fade show" id="createStudentModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalCenterTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header bg-primary">
                <h5 class="modal-title text-white" id="exampleModalLongTitle">Add New Student</h5>
                <button id="modalClose4" type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <form method="post" action="{% url 'add_student'%}">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="form-group">
                        <label for="recipient-name" class="col-form-label">Student Name:</label>
                        {{ form_student.name }}
                    </div>
                    <div class="form-group">
                        <label for="message-text" class="col-form-label">Phone:</label>
                        {{ form_student.phone }}
                    </div>
                    {% comment %}
                    <div class="form-group">
                        <label for="message-text" class="col-form-label">Grade:</label>
                        {{ form_student.grade }}
                    </div>
                    {% endcomment %}
                </div>
                <div class="modal-footer">
                    <button id="modalClose5" type="button" class="btn btn-danger">Close</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% block extrascripts %}
<script>
    // modal form for creating new students
    document.getElementById('new-student-button').addEventListener('click', function() {
        console.log('clicked: create new student')
        var modal = document.getElementById('createStudentModal')
        console.log('clicked: create new student', modal)

        modal.style.display = 'block'
    });

    const closeBtn4 = document.getElementById('modalClose4');
    const closeBtn5 = document.getElementById('modalClose5');
    closeBtn4.addEventListener('click',()=>{
        const modal = document.getElementById('createStudentModal')
        modal.style.display = 'none';
    });
    closeBtn5.addEventListener('click',()=>{
        const modal = document.getElementById('createStudentModal')
        modal.style.display = 'none';
    });
</script>
{% endblock extrascripts %}
