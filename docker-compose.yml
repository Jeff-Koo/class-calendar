services:
  postgres-db:
    restart: on-failure:10
    image: postgres:16
    volumes:
      - ../postgres-event-calendar/data/db:/var/lib/postgresql/data
    env_file:
      - .env.db
    container_name: db_container

  calendar-app:
    build: .
    image: event-calendar:latest
    # use built image from docker repository 
    # image: jeffkoo/event-calendar:production
    env_file:
      - .env
    ports: 
      - 8000:8000
    container_name: django_container
    command: sh docker-entrypoint.sh
    depends_on:
      - postgres-db
